<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2b1d14">
  <meta name="description" content="চালাবন ফার্ম — গাজীপুরের লালমাটি, বাইদ আর শালবনের একটি খামার-জীবনের গেম।">
  <title>চালাবন ফার্ম</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="world"></canvas>

  <div id="hud" aria-live="polite">
    <div class="card left">
      <div id="hud-place" class="place"></div>
      <div id="hud-date" class="date"></div>
      <div class="row2"><span id="hud-time"></span><span id="hud-weather" class="pill"></span></div>
    </div>
    <div class="card right">
      <div id="hud-coins" class="coins"></div>
      <div class="energy"><div id="hud-energy-bar"></div></div>
    </div>
  </div>

  <div id="toasts"></div>

  <div id="controls">
    <div id="joy" aria-label="হাঁটার নিয়ন্ত্রণ"><div id="joy-base"></div><div id="joy-knob"></div></div>
    <div class="utility">
      <button id="btn-bag" class="icon" aria-label="ঝোলা">🎒</button>
      <button id="btn-book" class="icon" aria-label="ডায়েরি">📔</button>
      <button id="btn-menu" class="icon" aria-label="মেনু">☰</button>
    </div>
    <div class="actions">
      <button id="btn-held" class="held" aria-label="হাতের জিনিস পাল্টাও">
        <img id="held-icon" alt="">
        <span id="held-name"></span>
      </button>
      <button id="btn-act" class="act" aria-label="কাজ করো">A</button>
    </div>
  </div>

  <div id="fade"></div>
  <div id="modal"></div>
  <div id="rotate">📱 ফোনটি পাশাপাশি (landscape) করে ধরো</div>

  <script src="js/version.js"></script>
  <script src="js/data.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
