name: Android APK release (Godot 4)

# Builds the Godot 4 game (GDScript core), exports a signed arm64 APK
# and publishes it as a GitHub Release. Each run gets versionCode = 1000 + run_number and
# keeps the same package id and signing key, so phones install it as an update.
on:
  push:
    branches: [arena/279b11b0-farm-s]
    paths:
      - "godot/**"
      - "tools/**"
      - "signing/**"
      - "CHANGELOG.md"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_DIR: "4.7.2.stable"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Load signing config
        run: |
          set -a
          . signing/signing.env
          set +a
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$GITHUB_WORKSPACE/signing/release.p12"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Compute version
        run: |
          VC=$((1000 + ${{ github.run_number }}))
          VN="2.0.${{ github.run_number }}"
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "APK_NAME=chalabon-farm-v${VN}.apk" >> "$GITHUB_ENV"
          sed -i "s/^version\/code=.*/version\/code=$VC/" godot/export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"$VN\"/" godot/export_presets.cfg
          grep -E "^version/" godot/export_presets.cfg

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1); fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;28.1.13356709" > sdk.log 2>&1 || { tail -40 sdk.log; exit 1; }
          tail -2 sdk.log
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install Godot ${{ env.GODOT_VERSION }} editor and Android export templates
        run: |
          set -e
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 755 Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p tpz && unzip -q templates.tpz -d tpz && rm -f templates.tpz
          DEST="$HOME/.local/share/godot/export_templates/$GODOT_DIR"
          mkdir -p "$DEST"
          find tpz -type f \( -name 'android_*' -o -name 'version.txt' \) -exec cp {} "$DEST/" \;
          ls "$DEST" | head -30
          cat "$DEST/version.txt"; echo
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres; do
            printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
              "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
              "export/android/java_sdk_path = \"$JAVA_HOME\"" > "$HOME/.config/godot/$f"
          done
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import project and run headless smoke test
        run: |
          set +e
          timeout 300 godot --headless --path godot --import > import.log 2>&1
          echo "import exit $?"
          tail -n 5 import.log
          set -e
          ls -la godot/.godot/ | head -5 || true
          set +e
          timeout 240 godot --headless --path godot --script res://tests/smoke_test.gd > smoke.log 2>&1
          CODE=$?
          set -e
          tail -n 80 smoke.log
          if ! grep -q "SMOKE_OK" smoke.log || [ $CODE -ne 0 ]; then
            echo "::error::smoke test exit code $CODE"
            grep -E "ERROR|SCRIPT|FAIL|SMOKE|rror" smoke.log | tail -n 40 | while IFS= read -r l; do echo "::error::smoke: ${l:0:300}"; done
            exit 1
          fi

      - name: Render UI screenshots (virtual display)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq xvfb > /dev/null 2>&1 || true
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" timeout 200 xvfb-run -a -s "-screen 0 1280x720x24" godot --path godot --rendering-driver opengl3 --script res://tests/screenshot.gd > shot.log 2>&1 || true
          grep -E "SHOT|ERROR" shot.log | head -20 || true
          ls -la ci-screens 2>/dev/null || true
          if ls ci-screens/*.png > /dev/null 2>&1; then
            git config user.name "Arena Agent"
            git config user.email "agent@arena.ai"
            git add ci-screens/*.png
            git commit -qm "CI: UI screenshots" || true
            git push -q origin HEAD:${GITHUB_REF_NAME} || echo "::error::screenshot push failed"
          fi

      - name: Export signed release APK
        run: |
          mkdir -p build
          set +e
          stdbuf -oL -eL godot --headless --verbose --path godot --export-release "Android" "$GITHUB_WORKSPACE/build/app.apk" > export.log 2>&1
          CODE=$?
          set -e
          tail -40 export.log
          if [ $CODE -ne 0 ] || [ ! -f build/app.apk ]; then
            echo "::error::export exit code $CODE; log lines $(wc -l < export.log)"
            echo "::error::EXPORT LOG: $(sed 's/\x1b\[[0-9;]*m//g' export.log | tr -d '\r' | grep -v first_scan | tail -n 40 | tr '\n' '|' | cut -c1-3500)"
            exit 1
          fi
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs build/app.apk | head -4
          "$BT/aapt" dump badging build/app.apk | head -3
          unzip -l build/app.apk | grep -E "chalabon_core|\.so" | head -5
          cp build/app.apk "$APK_NAME"
          cp build/app.apk chalabon-farm-latest.apk

      - name: Write release notes
        run: |
          awk 'BEGIN{n=0} /^## /{n++; if(n>1) exit} n>=1{print}' CHANGELOG.md > release-notes.md
          {
            echo ""
            echo "### ডাউনলোড ও আপডেট"
            echo "- **এই APK:** \`$APK_NAME\`"
            echo "- **সবসময়ের সর্বশেষ লিংক:** \`chalabon-farm-latest.apk\`"
            echo "- আগের APK না মুছে এই ফাইলটি ইনস্টল করলে আপডেট হবে। প্যাকেজ আইডি একই (com.chalabon.farm)।"
            echo "- ভার্সন: ${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo "- নোট: Godot সংস্করণে সেভ ফাইল আলাদা, পুরোনো WebView সংস্করণের সেভ আসবে না।"
          } >> release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${VERSION_NAME}" "$APK_NAME" chalabon-farm-latest.apk \
            --target "$GITHUB_SHA" \
            --title "চালাবন ফার্ম v${VERSION_NAME}" \
            --notes-file release-notes.md
