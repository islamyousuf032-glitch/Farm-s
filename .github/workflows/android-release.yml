name: Android APK release

# Builds a signed release APK from game/ + android/ and publishes it as a GitHub Release.
# Each run gets a new versionCode (= run number) so phones can install it over the previous APK.
on:
  push:
    branches: [arena/279b11b0-farm-s]
    paths:
      - "game/**"
      - "android/**"
      - "CHANGELOG.md"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Load signing config
        # The release key is committed under android/signing/ so every build uses the same key
        # (required for phones to accept APK updates). See docs/install-and-update-guide-bn.md.
        run: |
          while IFS='=' read -r k v; do echo "$k=$v" >> "$GITHUB_ENV"; done < android/signing/signing.env
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/signing/release.p12" >> "$GITHUB_ENV"

      - name: Run game rule tests
        run: node game/tests/test.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1); fi
          echo "using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > sdk.log 2>&1 || { tail -40 sdk.log; exit 1; }
          tail -3 sdk.log

      - name: Compute version
        run: |
          VC="${{ github.run_number }}"
          VN="1.0.${VC}"
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "APK_NAME=chalabon-farm-v${VN}.apk" >> "$GITHUB_ENV"
          printf 'window.CHALABON_VERSION = "%s";\n' "$VN" > game/js/version.js

      - name: Build signed APK
        run: |
          cd android
          if ! gradle :app:assembleRelease --no-daemon --stacktrace > "$GITHUB_WORKSPACE/gradle.log" 2>&1; then
            # surface the important lines as annotations (readable via the GitHub API)
            grep -v "^\s*at \|^\s*$" "$GITHUB_WORKSPACE/gradle.log" | grep -A12 -E "What went wrong|Build file|Caused by|FAILURE" | head -60 | while IFS= read -r line; do echo "::error::${line:0:600}"; done
            exit 1
          fi

      - name: Name, verify and prepare APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "$APK_NAME"
          cp "$APK" chalabon-farm-latest.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/34.0.0 | head -1)
          "$BT/apksigner" verify --print-certs "$APK_NAME" | head -5
          "$BT/aapt" dump badging "$APK_NAME" | head -3
          # release notes = first section of CHANGELOG.md
          awk 'BEGIN{n=0} /^## /{n++; if(n>1) exit} n>=1{print}' CHANGELOG.md > release-notes.md
          {
            echo ""
            echo "### ডাউনলোড ও আপডেট"
            echo "- **এই APK:** \`$APK_NAME\`"
            echo "- **সবসময়ের সর্বশেষ লিংক:** \`chalabon-farm-latest.apk\`"
            echo "- আগের APK না মুছে এই ফাইলটি ইনস্টল করলে আপডেট হবে, সেভ থাকবে।"
            echo "- ভার্সন: ${VERSION_NAME} (versionCode ${VERSION_CODE})"
          } >> release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v${VERSION_NAME}" "$APK_NAME" chalabon-farm-latest.apk \
            --target "$GITHUB_SHA" \
            --title "চালাবন ফার্ম v${VERSION_NAME}" \
            --notes-file release-notes.md
